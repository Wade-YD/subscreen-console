<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>副屏控制台</title>
<style>
  :root{
    --bg:#1E1E2E; --panel:#181825; --card:#313244; --text:#CDD6F4; --sub:#6C7086;
    --green:#A6E3A1; --red:#F38BA8; --blue:#89B4FA; --yellow:#F9E2AF; --peach:#FAB387;
  }
  *{box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI','Microsoft YaHei UI',sans-serif;}
  body{background:var(--bg); color:var(--text); padding:16px 18px; user-select:none;}
  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  h1{font-size:17px; font-weight:700;}
  .badge{font-size:11px; padding:3px 9px; border-radius:99px; background:var(--card); color:var(--sub);}
  .badge.ddc{background:#1e3a5f; color:var(--blue);}
  .badge.gamma{background:#3a2e1e; color:var(--peach);}
  .dispBar{margin-bottom:12px;}
  .dispBar select{width:100%; padding:9px 10px; border-radius:10px; border:0; background:var(--card);
    color:var(--text); font-family:inherit; font-size:12px; outline:none; cursor:pointer;}
  section{background:var(--panel); border-radius:12px; padding:14px 16px; margin-bottom:12px;}
  .row{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-size:13px;}
  .row .name{color:var(--text); font-weight:600;}
  .row .val{color:var(--blue); font-variant-numeric:tabular-nums;}
  .switches{display:flex; align-items:center; gap:16px; flex-wrap:wrap; font-size:12px;}
  .switches label{display:flex; align-items:center; gap:6px; cursor:pointer;}
  .switches input[type=checkbox]{accent-color:var(--blue); width:15px; height:15px; cursor:pointer;}
  input[type=range]{width:100%; height:26px; accent-color:var(--blue); cursor:pointer;}
  #sK{accent-color:var(--peach);}
  button{border:0; border-radius:10px; cursor:pointer; font-family:inherit;}
  .big{width:100%; padding:13px 0; font-size:16px; font-weight:700; color:#fff; background:var(--red); margin-top:4px;}
  .big.off{background:var(--green);}
  .big:disabled{opacity:.45; cursor:default;}
  .ghost{background:var(--card); color:var(--text); font-size:12px; padding:9px 0; width:100%;}
  .presets{display:flex; gap:8px; margin-top:12px;}
  .presets button{flex:1; background:var(--card); color:var(--text); font-size:12px; padding:8px 0;}
  .presets button.on{outline:2px solid var(--blue); color:var(--blue);}
  .dev{font-size:10px; color:var(--sub); margin-top:8px; word-break:break-all; line-height:1.4;}
  #log{font-size:11px; color:var(--yellow); min-height:16px; margin-top:8px; word-break:break-all;}
  .hidden{display:none;}
  .note{font-size:11px; color:var(--sub); margin-top:12px; line-height:1.5;}
  #hotkeyWarn{display:block; color:var(--peach); font-weight:600; margin-top:4px;}
</style>
</head>
<body>
<header>
  <h1>副屏控制台</h1>
  <span class="badge" id="engine">…</span>
</header>

<div class="dispBar">
  <select id="dispSel"><option>加载中…</option></select>
</div>

<section>
  <div class="switches">
    <label><input type="checkbox" id="ckAuto">开机自启</label>
    <label><input type="checkbox" id="ckNight">夜间自动暖色</label>
  </div>
  <div class="row" style="margin-top:10px"><span class="name">调光模式</span><span class="val" style="font-size:11px" id="dimHint"></span></div>
  <div class="presets" id="dimModes">
    <button data-m="quality">画质优先（50–100%）</button>
    <button data-m="deep">深度调暗（25–100%）</button>
  </div>
</section>

<section>
  <div class="row"><span class="name">副屏触摸</span><span class="val" id="touchState">检测中…</span></div>
  <button class="big" id="btnTouch" disabled>…</button>
  <div class="dev" id="touchDev"></div>
</section>

<section>
  <div class="row"><span class="name">亮度</span><span class="val" id="vBr">100%</span></div>
  <input type="range" id="sBr" min="1" max="100" value="100">
  <div id="contrastBox" class="hidden">
    <div class="row" style="margin-top:10px"><span class="name">对比度</span><span class="val" id="vCt">100%</span></div>
    <input type="range" id="sCt" min="0" max="100" value="100">
  </div>
  <div id="colorBox">
    <div class="row" style="margin-top:10px"><span class="name">色温</span><span class="val" id="vK">6500K</span></div>
    <input type="range" id="sK" min="2000" max="6500" step="50" value="6500">
    <div class="presets" id="presets">
      <button data-k="6500" class="on">标准</button>
      <button data-k="4500">暖色</button>
      <button data-k="3400">夜览</button>
      <button data-k="2000">烛光</button>
    </div>
  </div>
  <div class="note" id="engineNote"></div>
</section>

<button class="ghost" id="btnReset">恢复默认（亮度 100 / 色温 6500K）</button>
<div id="log"></div>
<div class="note">热键（全局）：Ctrl+Alt+↑/↓ 亮度 ±10 · Ctrl+Alt+←/→ 色温 · Ctrl+Alt+M 触摸开关 · Ctrl+Alt+Q 显示/隐藏面板。关闭窗口 = 最小化到托盘。<span id="hotkeyWarn"></span></div>

<script>
const $ = id => document.getElementById(id);
const cur = { engine: 'gamma', values: {}, touch: [], touchSel: null,
              apply_ok: true, hotkeys_ok: true, br_min: 25, dim_mode: 'deep' };
const WARN = '⚠ 系统拒绝了本次伽马写入，已回退显示';

function log(m){ $('log').textContent = m || ''; }

function render(){
  const ddc = cur.engine === 'ddc';
  const e = $('engine');
  e.textContent = ddc ? 'DDC/CI 硬件级' : '伽马 软件级';
  e.className = 'badge ' + (ddc ? 'ddc' : 'gamma');
  $('engineNote').textContent = ddc
    ? '硬件 DDC/CI 模式：调节直达显示器，与物理按键等效；色温映射为 RGB 增益。'
    : (cur.dim_mode === 'quality'
      ? '画质优先：纯线性等比调光，灰阶层次完全不变（不动对比度），下限 50%。'
      : '深度调暗：幂曲线压中间调，可调到 25%，但中暗部灰阶有压缩（对比感略降）。');
  $('dimHint').textContent = ddc ? '（仅伽马模式需要选择）' : '';
  document.querySelectorAll('#dimModes button').forEach(b => {
    b.classList.toggle('on', b.dataset.m === cur.dim_mode);
    b.disabled = ddc;
  });
  $('contrastBox').classList.toggle('hidden', !ddc);
  $('colorBox').classList.toggle('hidden', ddc);
  const v = cur.values;
  $('sBr').min = Math.min(cur.br_min, v.brightness);   // 亮度下限由后端下发 (br_min); 值低于 min 时暂抬 min 保持显示一致
  $('sBr').value = v.brightness; $('vBr').textContent = v.brightness + '%';
  $('sCt').value = v.contrast;   $('vCt').textContent = v.contrast + '%';
  $('sK').value = v.kelvin;      $('vK').textContent = (v.kelvin || 6500) + 'K';
  document.querySelectorAll('#presets button').forEach(b =>
    b.classList.toggle('on', +b.dataset.k === v.kelvin));
  $('ckNight').checked = !!v.night_mode;
  $('hotkeyWarn').textContent = cur.hotkeys_ok === false
    ? '⚠ 全局热键注册失败（可能被核显驱动等占用）' : '';
  renderTouch();
}

function renderDisplays(s){
  const sel = $('dispSel');
  sel.innerHTML = '';
  (s.displays || []).forEach(d => {
    const o = document.createElement('option');
    o.value = d.device;
    o.textContent = (d.primary ? '主屏 ' : '副屏 ') + d.device.replace('\\\\.\\', '');
    sel.appendChild(o);
  });
  if (s.target_device) sel.value = s.target_device;
}

function renderTouch(){
  const st = $('touchState'), btn = $('btnTouch');
  const devs = cur.touch || [];
  if (!devs.length){
    st.textContent = '未找到设备'; st.style.color = 'var(--peach)';
    btn.disabled = true; btn.textContent = '触摸开关'; btn.classList.remove('off');
    $('touchDev').textContent = '请检查副屏 USB 线后重启面板';
    cur.touchSel = null; return;
  }
  const d = devs[0];
  cur.touchSel = d.id;
  $('touchDev').textContent = d.id + (devs.length > 1 ? ('（共 ' + devs.length + ' 个，控制第 1 个）') : '');
  if (d.problem && d.problem !== 0 && d.problem !== 22){
    st.textContent = '设备异常 (' + d.problem + ')'; st.style.color = 'var(--peach)';
    btn.disabled = true; btn.textContent = '触摸开关不可用'; btn.classList.remove('off');
    return;
  }
  if (d.enabled){
    st.textContent = '已开启'; st.style.color = 'var(--green)';
    btn.disabled = false; btn.textContent = '关闭副屏触摸'; btn.classList.remove('off');
  } else {
    st.textContent = '已关闭'; st.style.color = 'var(--red)';
    btn.disabled = false; btn.textContent = '开启副屏触摸'; btn.classList.add('off');
  }
}

async function refresh(){
  try {
    const s = await pywebview.api.get_state();
    cur.engine = s.engine; cur.values = s.values || {}; cur.touch = s.touch;
    cur.apply_ok = s.apply_ok;
    cur.dim_mode = (s.dim_mode === 'quality') ? 'quality' : 'deep';
    cur.hotkeys_ok = s.hotkeys_ok !== false;
    cur.br_min = (typeof s.br_min === 'number') ? s.br_min : (cur.dim_mode === 'quality' ? 50 : 25);
    renderDisplays(s);
    render();
    if (s.apply_ok === false) log(WARN);
    else if ($('log').textContent === WARN) log('');
  } catch(e){ log('读取状态失败: ' + e); }
}
window.__sync = refresh;   // 供热键线程 evaluate_js 同步 UI

function deb(fn, ms){ let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function bindSlider(sid, vid, key){
  const s = $(sid), v = $(vid);
  s.addEventListener('input', deb(() => {
    v.textContent = s.value + '%';
    pywebview.api.set_value(key, +s.value).then(r => {
      if (!r || !r.ok) log('调节失败');
      else if (r.apply_ok === false) log(WARN);
    });
  }, 140));
}
bindSlider('sBr','vBr','brightness');
bindSlider('sCt','vCt','contrast');

$('sK').addEventListener('input', deb(() => {
  $('vK').textContent = $('sK').value + 'K';
  pywebview.api.set_value('kelvin', +$('sK').value).then(r => {
    if (!r || !r.ok) log('调节失败');
    else if (r.apply_ok === false) log(WARN);
  });
}, 140));

document.querySelectorAll('#presets button').forEach(b => {
  b.addEventListener('click', async () => {
    const res = await pywebview.api.set_value('kelvin', +b.dataset.k);
    if (res && res.ok){ await refresh(); log('已应用色温 ' + b.dataset.k + 'K'); }
  });
});

$('btnTouch').addEventListener('click', async () => {
  if (!cur.touchSel) return;
  const btn = $('btnTouch');
  const enable = btn.classList.contains('off');
  btn.disabled = true; btn.textContent = '切换中…（请在 UAC 弹窗点“是”）';
  try {
    const r = await pywebview.api.toggle_touch(cur.touchSel, enable);
    cur.touch = r.touch; renderTouch();
    log(r.msg || (r.ok ? '已切换' : '切换失败'));
  } catch(e){ log('异常: ' + e); renderTouch(); }
});

$('btnReset').addEventListener('click', async () => {
  const r = await pywebview.api.reset_all();
  if (r.ok){ await refresh(); log('已恢复默认'); }
});

$('ckAuto').addEventListener('change', async () => {
  const want = $('ckAuto').checked;
  try {
    const r = await pywebview.api.set_autostart(want);
    if (!r || !r.ok){ $('ckAuto').checked = !!(r && r.autostart); log('开机自启设置失败'); }
    else { $('ckAuto').checked = !!r.autostart; log(r.autostart ? '已开启开机自启' : '已关闭开机自启'); }
  } catch(e){ $('ckAuto').checked = !want; log('异常: ' + e); }
});

$('ckNight').addEventListener('change', async () => {
  try {
    const r = await pywebview.api.set_night_mode($('ckNight').checked);
    if (r && r.ok) log(r.night_mode ? '夜间自动暖色已开启（日落后自动切换到夜览色温）' : '夜间自动暖色已关闭');
  } catch(e){ log('异常: ' + e); }
});

document.querySelectorAll('#dimModes button').forEach(b => {
  b.addEventListener('click', async () => {
    if (b.dataset.m === cur.dim_mode) return;
    try {
      const r = await pywebview.api.set_dim_mode(b.dataset.m);
      if (r && r.ok){
        await refresh();
        log(r.dim_mode === 'quality'
          ? '已切换画质优先：等比调光不动对比度，下限 50%'
          : '已切换深度调暗：可调到 25%，中暗部灰阶有压缩');
      }
    } catch(e){ log('异常: ' + e); }
  });
});

$('dispSel').addEventListener('change', async () => {
  try {
    const r = await pywebview.api.select_display($('dispSel').value);
    if (r && r.ok){ await refresh(); log('已切换控制目标'); }
    else log((r && r.msg) || '切换失败');
  } catch(e){ log('异常: ' + e); }
});

window.addEventListener('pywebviewready', refresh);
</script>
</body>
</html>
